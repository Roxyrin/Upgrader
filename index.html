<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rust Upgrader</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#15110e;--panel:#211b17;--line:#3a2f27;--text:#d8ccb8;--dim:#8d8071;--rust:#c8431a;--rust2:#e8742f;--ok:#7bb84a;--bad:#d2402f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:15px/1.35 "Trebuchet MS",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:2px solid var(--rust)}
.logo{font:900 20px/1 Impact,"Arial Narrow",sans-serif;letter-spacing:.5px}.logo i{color:var(--rust2);font-style:normal}
.bal{background:var(--panel);border:1px solid var(--line);padding:5px 10px;font-weight:700}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:11px;background:none;border:0;border-bottom:3px solid transparent;color:var(--dim);font:inherit;font-weight:700}
nav button.on{color:var(--text);border-color:var(--rust2)}
main{padding:12px 14px 30px;max-width:520px;margin:auto}
h3{margin:16px 0 8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{background:var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--c);padding:8px 4px;text-align:center;font-size:12px;position:relative;color:inherit;font-family:inherit}
.it b{display:block;font-size:24px;margin-bottom:2px}.it span{color:var(--dim)}
.it.on{outline:2px solid var(--rust2);background:#2c211a}.it:disabled{opacity:.35}
.wheel{position:relative;width:220px;height:220px;margin:6px auto}
.wheel svg{width:100%;height:100%}.mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.mid b{font:900 34px Impact,sans-serif}.mid small{color:var(--dim)}
#ptr{transform-origin:100px 100px}
.btn{width:100%;padding:13px;background:var(--rust);border:0;color:#fff;font:800 16px inherit;font-family:inherit;margin-top:10px}
.btn:disabled{background:#4a3a30;color:var(--dim)}.btn.s{width:auto;padding:8px 12px;font-size:14px;margin:0}
input,select{width:100%;padding:10px;background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.msg{text-align:center;font-weight:800;min-height:22px;margin-top:6px}
.user{display:flex;justify-content:space-between;padding:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:6px;width:100%;color:inherit;font:inherit;text-align:left}
.empty{color:var(--dim);padding:14px 0;text-align:center}
.x{position:absolute;top:2px;right:4px;color:var(--bad);font-weight:900}
</style></head><body>
<header><div class="logo">RUST<i>GRADE</i></div><div class="bal" id="bal"></div></header>
<nav id="tabs"></nav>
<main id="app"></main>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const INIT=tg.initData||('dev:'+(new URLSearchParams(location.search).get('dev')||'1:test'));
const S={me:null,cat:[],admin:false,tab:'up',sel:new Set(),target:null,bet:0,angle:0,spin:false,msg:'',q:'',users:[],pick:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const col=p=>p>=6000?'#e8c14f':p>=2000?'#d2402f':p>=600?'#a05cd6':p>=140?'#4a8fd6':'#8d8071';
async function api(p,b={}){
  const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...b,initData:INIT})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Ошибка');return d;
}
const item=(id,extra='')=>{const c=S.cat[id];return `<b>${c.e}</b>${c.name}<br><span>${c.price}</span>${extra}`};
const stakeSum=()=>S.me.inv.filter(i=>S.sel.has(i.uid)).reduce((s,i)=>s+S.cat[i.id].price,0)+S.bet;
const chance=()=>{const t=S.cat[S.target];if(!t)return 0;const s=stakeSum();return s>=t.price?0:Math.min(90,Math.round(s/t.price*10000)/100)};

function render(){
  $('bal').textContent='💰 '+S.me.balance;
  const tabs=[['up','Апгрейд'],['inv','Инвентарь']];if(S.admin)tabs.push(['adm','Админ']);
  $('tabs').innerHTML=tabs.map(([k,n])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';S.msg='';render()">${n}</button>`).join('');
  $('app').innerHTML=S.tab==='up'?upView():S.tab==='inv'?invView():admView();
}
function upView(){
  const ch=chance(),C=2*Math.PI*80,inv=S.me.inv,sum=stakeSum();
  return `<div class="wheel"><svg viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#3a2f27" stroke-width="16"/>
    <circle cx="100" cy="100" r="80" fill="none" stroke="#7bb84a" stroke-width="16" stroke-dasharray="${ch/100*C} ${C}" transform="rotate(-90 100 100)"/>
    <g id="ptr" style="transform:rotate(${S.angle}deg)"><path d="M100 4 L92 -8 L108 -8Z" transform="translate(0 14)" fill="#e8742f"/><rect x="98" y="6" width="4" height="22" fill="#e8742f"/></g></svg>
    <div class="mid"><b>${ch}%</b><small>шанс</small></div></div>
  <div class="msg" style="color:${S.msg.startsWith('✔')?'var(--ok)':'var(--bad)'}">${esc(S.msg)}</div>
  <div class="row"><input id="bet" type="number" min="0" inputmode="numeric" placeholder="Ставка балансом" value="${S.bet||''}" oninput="S.bet=Math.max(0,Math.floor(+this.value||0));upd()"></div>
  <button class="btn" id="go" ${S.spin||!ch?'disabled':''} onclick="go()">Апгрейд · ставка ${sum}</button>
  <h3>Твои предметы (ставка)</h3>
  ${inv.length?`<div class="grid">${inv.map(i=>`<button class="it ${S.sel.has(i.uid)?'on':''}" style="--c:${col(S.cat[i.id].price)}" onclick="tog('${i.uid}')">${item(i.id)}</button>`).join('')}</div>`:'<div class="empty">Пока пусто. Можно ставить баланс.</div>'}
  <h3>Цель</h3>
  <div class="grid">${S.cat.map(c=>`<button class="it ${S.target===c.id?'on':''}" style="--c:${col(c.price)}" ${c.price<=sum?'disabled':''} onclick="S.target=${c.id};S.msg='';render()">${item(c.id)}</button>`).join('')}</div>`;
}
function upd(){ // обновить шанс без потери фокуса в поле ставки
  const a=$('bet');const f=document.activeElement===a,pos=a.selectionStart;render();
  if(f){const n=$('bet');n.focus();n.setSelectionRange(pos,pos)}
}
function tog(u){S.sel.has(u)?S.sel.delete(u):S.sel.add(u);if(S.target!==null&&S.cat[S.target].price<=stakeSum())S.target=null;S.msg='';render()}
async function go(){
  if(S.target===null){S.msg='Выбери цель';return render()}
  S.spin=true;S.msg='';
  try{
    const d=await api('upgrade',{uids:[...S.sel],targetId:S.target,bet:S.bet});
    const p=$('ptr');p.style.transition='none';p.style.transform='rotate(0deg)';p.getBoundingClientRect();
    S.angle=360*6+d.roll*3.6;p.style.transition='transform 4s cubic-bezier(.12,.6,.1,1)';p.style.transform=`rotate(${S.angle}deg)`;
    await new Promise(r=>setTimeout(r,4200));
    S.angle=d.roll*3.6;S.me=d.user;S.sel.clear();S.bet=0;
    S.msg=d.win?`✔ Выигрыш: ${S.cat[S.target].name}`:`Не повезло (выпало ${d.roll}, нужно <${d.chance})`;
    tg.HapticFeedback?.notificationOccurred(d.win?'success':'error');S.target=null;
  }catch(e){S.msg=e.message}
  S.spin=false;render();
}
function invView(){
  const inv=S.me.inv;
  return `<div class="msg" style="color:var(--bad)">${esc(S.msg)}</div>`+(inv.length?`<div class="grid">${inv.map(i=>`<div class="it" style="--c:${col(S.cat[i.id].price)}">${item(i.id)}<div class="row" style="padding:4px"><button class="btn s" onclick="sell('${i.uid}')">Продать</button></div></div>`).join('')}</div>`:'<div class="empty">Инвентарь пуст</div>');
}
async function sell(u){try{S.me=(await api('sell',{uid:u})).user}catch(e){S.msg=e.message}render()}

// ---- Админка ----
async function find(){
  try{S.users=(await api('admin/users',{q:S.q})).users;S.msg=''}catch(e){S.msg=e.message}render();
}
async function adm(path,b){
  try{const d=await api('admin/'+path,b);S.pick=d.user;S.users=S.users.map(u=>u.id===d.user.id?d.user:u);S.msg=''}catch(e){S.msg=e.message}render();
}
function admView(){
  const p=S.pick;
  return `<div class="row"><input id="q" placeholder="@username или ID" value="${esc(S.q)}" oninput="S.q=this.value" onkeydown="if(event.key==='Enter')find()"><button class="btn s" style="flex:0 0 auto" onclick="find()">Найти</button></div>
  <div class="msg" style="color:var(--bad)">${esc(S.msg)}</div>
  ${S.users.map(u=>`<button class="user" onclick="S.pick=S.users.find(x=>x.id===${u.id});render()"><span>${esc(u.name)} ${u.username?'@'+esc(u.username):''}</span><b>💰 ${u.balance}</b></button>`).join('')}
  ${p?`<h3>${esc(p.name)} · ${p.id} · баланс ${p.balance}</h3>
  <div class="row"><input id="amt" type="number" inputmode="numeric" placeholder="Сумма"></div>
  <div class="row"><button class="btn s" onclick="adm('balance',{userId:${p.id},mode:'add',amount:+$('amt').value})">+ Добавить</button>
  <button class="btn s" onclick="adm('balance',{userId:${p.id},mode:'add',amount:-$('amt').value})">− Забрать</button>
  <button class="btn s" onclick="adm('balance',{userId:${p.id},mode:'set',amount:+$('amt').value})">Установить</button></div>
  <h3>Выдать предмет</h3>
  <div class="row"><select id="gift">${S.cat.map(c=>`<option value="${c.id}">${c.e} ${c.name} (${c.price})</option>`).join('')}</select>
  <button class="btn s" style="flex:0 0 auto" onclick="adm('item',{userId:${p.id},action:'add',itemId:+$('gift').value})">Выдать</button></div>
  <h3>Инвентарь игрока</h3>
  ${p.inv.length?`<div class="grid">${p.inv.map(i=>`<div class="it" style="--c:${col(S.cat[i.id].price)}" onclick="adm('item',{userId:${p.id},action:'remove',uid:'${i.uid}'})">${item(i.id,'<div class=x>✕</div>')}</div>`).join('')}</div>`:'<div class="empty">Пусто</div>'}`:''}`;
}

(async()=>{
  try{const d=await api('me');S.me=d.user;S.cat=d.catalog;S.admin=d.admin;render()}
  catch(e){$('app').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
})();
</script></body></html>
